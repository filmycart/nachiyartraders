services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_app
    volumes:
      - ./src:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=nachiyar_traders_live_new
      - DB_USERNAME=ntr_usr
      - DB_PASSWORD=Nachiyar*1984  
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - laravel

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nachiyar_traders_live_new
      MYSQL_USER: ntr_usr
      MYSQL_PASSWORD: Nachiyar*1984
      MYSQL_ROOT_PASSWORD: Nachiyar*1984
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel

  adminer:
    image: adminer
    container_name: ntr-adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - db
    networks:
      - laravel      

networks:
  laravel:

volumes:
  dbdata:
