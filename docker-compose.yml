services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel10-app
    container_name: laravel10-app
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=nachiyar_traders_live_new
      - DB_USERNAME=ntr_usr
      - DB_PASSWORD=Nachiyar*1984

  db:
    image: mysql:8.0
    container_name: laravel10-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nachiyar_traders_live_new
      MYSQL_USER: ntr_usr
      MYSQL_PASSWORD: Nachiyar*1984
      MYSQL_ROOT_PASSWORD: Nachiyar*1984
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db    

  npm:
    image: node:20
    container_name: laravel10-npm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["npm", "run", "dev"]

volumes:
  db_data:
