services:
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    image: laravel10-app
    container_name: ntr-app
    restart: unless-stopped
    ports:
      - "9002:80"
      - "9003:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/ssl/private
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=nachiyar_traders_live_new
      - DB_USERNAME=ntr_usr
      - DB_PASSWORD=Nachiyar*1984
    networks:
      - ntr_network

  db:
    image: mysql:8.0
    container_name: ntr-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nachiyar_traders_live_new
      MYSQL_USER: ntr_usr
      MYSQL_PASSWORD: Nachiyar*1984
      MYSQL_ROOT_PASSWORD: Nachiyar*1984
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - ntr_network  

  adminer:
    image: adminer
    container_name: ntr-adminer
    restart: always
    ports:
      - "8090:8080"
    depends_on:
      - db
    networks:
      - ntr_network  

  npm:
    image: node:20
    container_name: ntr-npm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: ["npm", "run", "dev"]
    networks:
      - ntr_network

volumes:
  db_data:

networks:
  ntr_network:
    driver: bridge